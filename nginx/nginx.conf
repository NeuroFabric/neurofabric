# NGINX REVERSE PROXY — WEDGE ENTERPRISE GATEWAY
#
# Terminates TLS at port 443 (self-signed placeholder certs) and proxies to the
# Node backend on the internal Docker network. Port 80 redirects to 443 so plain
# HTTP never carries data. Port 443 is the only surface exposed on the host.
#
# TLS CERTIFICATES
# Replace the self-signed placeholders with real certs before serving external
# traffic. Paths below match the volumes declared in docker-compose.yml:
#   /etc/nginx/certs/wedge.crt
#   /etc/nginx/certs/wedge.key
# Generate a temporary self-signed pair with:
#   openssl req -x509 -nodes -newkey rsa:4096 -days 365 \
#     -keyout certs/wedge.key -out certs/wedge.crt \
#     -subj "/CN=wedge.local"
#
# SECURITY HEADERS
# Every response carries a minimal set. The Content-Security-Policy is kept
# permissive here because the Node backend already controls it per-route; the
# nginx layer adds the frame-denial and referrer headers that the app layer
# never sees.
#
# WORKER COUNT
# `auto` resolves to the number of CPU cores available to the container. The
# container is allocated 1 CPU in docker-compose, so this will resolve to 1.
# Changing the CPU quota changes the worker count without a config edit.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # --- Logging ---
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # --- Performance ---
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  gzip               on;
  gzip_types         text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length    1024;

  # --- Request limits ---
  client_max_body_size     16m;
  client_body_buffer_size  128k;
  large_client_header_buffers 4 8k;

  # --- Upstream: the Node wedge backend ---
  upstream wedge_backend {
    server wedge:8080;
    keepalive 16;
  }

  # ─── HTTP → HTTPS redirect ────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Return a 301 rather than proxying over plain HTTP. This is the only
    # thing port 80 does; it does not proxy, does not serve content.
    return 301 https://$host$request_uri;
  }

  # ─── HTTPS reverse proxy ─────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;

    # --- TLS ---
    # Self-signed placeholders. Replace with real certs for production.
    ssl_certificate     /etc/nginx/certs/wedge.crt;
    ssl_certificate_key /etc/nginx/certs/wedge.key;

    # Modern TLS only: TLS 1.2 is kept for broad client compatibility;
    # TLS 1.0/1.1 are disabled as they are deprecated by RFC 8996.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # Session resumption — reduces TLS handshake cost on reconnect.
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling (disable if the placeholder cert has no OCSP responder).
    ssl_stapling        off;

    # --- Security headers ---
    add_header X-Frame-Options            "DENY"                        always;
    add_header X-Content-Type-Options     "nosniff"                     always;
    add_header Referrer-Policy            "no-referrer"                 always;
    add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains" always;

    # --- Proxy pass to the Node backend ---
    location / {
      proxy_pass         http://wedge_backend;
      proxy_http_version 1.1;

      # WebSocket / SSE support (the event stream uses chunked transfer).
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Forward real client identity.
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # SSE streams must not be buffered — buffering holds the entire stream
      # in the proxy's memory before flushing to the client, which means the
      # browser sees nothing until the connection closes.
      proxy_buffering            off;
      proxy_cache                off;
      proxy_read_timeout         300s;
      proxy_connect_timeout      10s;
      proxy_send_timeout         60s;

      # Do not pass 502/504 to the client before the upstream has a chance to
      # start. The wedge container may be a second or two behind the proxy.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }

    # --- Health endpoint (Nginx itself, not the backend) ---
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
