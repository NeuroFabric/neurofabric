# CI gate for the Neurofebric harness.
#
# Dependencies: there is no root package.json dependency graph. The root
# package-lock.json declares name "agent-harness" with "packages": {}, so the
# harness has zero runtime dependencies and no install step is required. The
# suites run on bare node, which is the repo convention.
#
# Node version: nothing in the repo pins a version (no .nvmrc, no engines
# field), so 22 LTS is used. 22 is also the floor for
# --experimental-strip-types, which the .ts suites and the proof script need
# in order to import platform .ts modules from node.
name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: platform test suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Platform .mjs suites
        run: node --test platform/*.test.mjs

      - name: Core and Pi .ts suites
        run: node --experimental-strip-types --test platform/core/*.test.ts platform/pi/*.test.ts

      # The F-006 live proof is INCLUDED: it is headless and self-contained.
      # It drives the real KernelAdapter and the real recovery decision
      # function with stubbed tool results. It uses no model, no gateway, and
      # no network, and it writes no files, so it depends on no local-only
      # resource and runs unchanged on a CI runner.
      - name: F-006 live recovery proof
        run: node --experimental-strip-types verification/live-f006-proof.mjs

  # The workspace boundary has exactly one platform conditional,
  # `CASE_INSENSITIVE` in platform/core/workspace.ts, and the whole suite
  # passes on both OS families. Recording only ubuntu left that as an
  # unverified property: a Windows-only regression in the boundary — case
  # handling, separator handling, or realpath/junction resolution — could merge
  # green against an ubuntu-only gate.
  #
  # This is a SEPARATE JOB rather than a matrix on `test`, on purpose. The
  # "Protect main branch" ruleset requires a status check whose context is
  # exactly `platform test suites`, and a matrix makes GitHub append the matrix
  # values to the check name. A matrix on the required job would silently
  # rename it and block every merge. Keeping the required job untouched and
  # adding this one alongside makes the Windows result enforced without
  # touching the gate that already protects main.
  test-windows:
    name: platform test suites on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Platform .mjs suites
        run: node --test platform/*.test.mjs

      - name: Core and Pi .ts suites
        run: node --experimental-strip-types --test platform/core/*.test.ts platform/pi/*.test.ts

      - name: F-006 live recovery proof
        run: node --experimental-strip-types verification/live-f006-proof.mjs
