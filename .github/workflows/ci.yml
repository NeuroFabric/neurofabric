name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Root Dependencies
      run: npm ci || npm install

    - name: Verify No .env or Raw Secrets Committed
      run: |
        if git ls-files | grep -E '^\.env$|\.pem$|\.key$'; then
          echo "CRITICAL: Secret file tracked in git!"
          exit 1
        fi

    - name: Run 32-Point Backend Triage & Security Suite
      run: node --experimental-strip-types scripts/triage-agent-client.ts

    - name: Build & Typecheck Platform UI Cockpit
      working-directory: platform/ui
      run: |
        npm ci || npm install
        npx tsc -b
        npm run build
