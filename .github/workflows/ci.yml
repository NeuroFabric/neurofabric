name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Root Dependencies
      run: npm ci || npm install

    - name: Run Backend Triage & Contract Verification
      run: node --experimental-strip-types scripts/triage-agent-client.ts

    - name: Build Platform UI Cockpit
      working-directory: platform/ui
      run: |
        npm install
        npx tsc -b
        npm run build
