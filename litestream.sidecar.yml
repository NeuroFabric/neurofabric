# LITESTREAM, SCOPED TO THE WEDGE DATABASE.
#
# === WHY THIS FILE EXISTS INSTEAD OF JUST USING litestream.yml ===
#
# `litestream.yml` lists BOTH databases, and the second one is the embassy's
# approval ledger at `$NEUROFEBRIC_AUDIT_DIR`. The wedge container has no such
# directory and runs no embassy, so pointing the sidecar at the full config gives
# Litestream a database path that does not exist in that container.
#
# A replication agent that cannot open every database it was told about is a
# replication agent that may refuse to start, and a sidecar in a crash loop protects
# nothing while looking like it does. This file states only what this container can
# actually see.
#
# The consequence is stated rather than papered over: **the approval ledger is NOT
# replicated by this sidecar.** It lives with the embassy, in a different container
# on a different volume. A deployment that runs the approval path must replicate it
# from there, or it has no copy of who approved which credential read.
#
# Config is split, not duplicated: the credentials, endpoint, retention and
# back-pressure settings are identical to `litestream.yml` and must be changed in
# both.

access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}

replicas:
  - name: primary
    type: s3
    endpoint: ${REPLICA_URL}
    bucket: ${REPLICA_BUCKET}
    region: ${REPLICA_REGION}
    sync-interval: 1s
    retention: 720h
    retention-check-interval: 1h

dbs:
  # The wedge's durable record. start-ui.mjs resolves the workspace to
  # `$WEDGE_WORKSPACE` and puts the database at `<workspace>/workspace/memory`.
  # Globbed so a deployment that mounts the volume somewhere else still matches one
  # database rather than failing to start on a path that moved.
  - path: /app/workspace/workspace/memory/*.sqlite
    replica: primary