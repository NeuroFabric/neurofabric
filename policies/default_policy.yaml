# ============================================================
# Development & Engineering Policy for NeuroFabric Harness
# ============================================================

allowed_tools:
  - read_file
  - write_file
  - edit_file
  - list_files
  - bash
  - shell_exec
  - web_search_stub

denied_tools:
  - delete_file
  - network_raw

# Allow access to the repository tree
file_rules:
  - path: "**"
    read: allow
    write: allow

# Remove 'password' and 'api_key' so the agent can write DLP scrubbers.
# Keep only destructive operating system commands.
denied_content_patterns:
  - "rm -rf /"
  - "format c:"

limits:
  max_tool_calls_per_run: 200
  max_file_writes_per_run: 50
  max_bytes_per_write: 5000000   # ~5MB

on_violation: block