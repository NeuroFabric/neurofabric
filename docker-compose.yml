# THE WEDGE, ORCHESTRATED. The security properties live HERE, not only in the
# Dockerfile, because this is the file an operator actually runs.
#
# STATUS: UNVERIFIED. Docker is absent from the authoring environment, so this
# has never been brought up. The Dockerfile says so too. An orchestration file
# that has been reasoned about carefully and never executed is a design, not a
# deployment, and the difference is exactly the kind this repository keeps
# insisting on. Operator to run:
#     docker compose up --build
# then confirm the archive is inside the volume and the port is loopback-only.

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - wedge
    restart: unless-stopped

  wedge:
    build:
      context: .
      dockerfile: Dockerfile
    image: neurofebric/wedge:local
    # NO `privileged`, no `network_mode: host`, no host filesystem mount, no
    # added capabilities. All four are things a deployment reaches for when it
    # is fighting the container, and all four would dissolve the only boundary
    # this product has. The process reads the user's files; a container escape
    # starts from exactly here.
    restart: unless-stopped

    # THE DATA BOUNDARY IS A NAMED VOLUME, AND IT IS THE ONLY MOUNT.
    #
    # A named volume rather than a host bind, for one reason that matters: a
    # bind mount hands the container whatever the host path resolves to, and the
    # operator's idea of "the data directory" is often the repository root. A
    # named volume starts empty every time, so the only thing in it is what was
    # deliberately put there. If the operator wants their own CSVs analysed, the
    # honest route is `docker compose cp` or an explicit bind they added on
    # purpose -- not a default that quietly exposes the working tree.
    volumes:
      - wedge-data:/app/workspace
    working_dir: /app

    # THE STARTUP COMMAND, REPEATED HERE DELIBERATELY.
    #
    # It overrides the image's CMD so that the garbage collection limits can be
    # raised for one deployment without rebuilding the image. The duplication is
    # the point rather than a mistake: an operator tuning heap for a large export
    # should edit a value they can see in the file they are already running,
    # rather than rebuild an image to change one number.
    #
    # It MUST stay identical to the Dockerfile's CMD otherwise. The flags are the
    # same two -- a capped old generation and a wider young generation -- and
    # `--experimental-strip-types` is not optional: the boot script and the
    # TypeScript suites will not start without it.
    #
    # The relationship to `mem_limit` below is the one that bites. The heap is
    # only part of the process; code space, the native allocator, socket buffers
    # and V8 metadata sit outside the old generation. So the heap cap must stay
    # WELL BELOW the container limit, or the kernel kills the process before V8's
    # own cap ever fires, and the operator gets an OOM with no explanation from
    # the runtime. 256 against 512 leaves that room.
    command:
      - node
      - --max-old-space-size=256
      - --max-semi-space-size=2
      - --experimental-strip-types
      - start-ui.mjs
      - --workspace
      - /app/workspace
      - --port
      - "8080"
      - --host
      - 0.0.0.0

    environment:
      # The workspace, stated twice: once as the boundary the Dockerfile sets and
      # once as the argument the process is started with. Redundant on purpose.
      # A deployment whose boundary depends on one environment variable that
      # someone can forget to set is a deployment with an unbounded boundary.
      WEDGE_WORKSPACE: /app/workspace
      NODE_ENV: production
      PORT: "8080"
      WEDGE_HOST: "0.0.0.0"

    # THE PUBLISHED PORT IS LOOPBACK-ONLY ON THE HOST. This is the half that
    # makes the container's 0.0.0.0 bind safe.
    #
    # Inside the container the process must bind 0.0.0.0, because Docker
    # forwards published ports to the container's own interface and a loopback
    # bind there is unreachable -- the wedge would start and then refuse every
    # connection. Outside it, `127.0.0.1:8080` means the only host that can reach
    # it is the one sitting at the keyboard, which is the same reachable surface
    # as running `start-ui.mjs` directly.
    #
    # It is tempting to write "8080:8080" here so a colleague on the network can
    # look at a demo. That single character change turns a local tool that reads
    # private files into a service on the office LAN, and it would work, and
    # that is the problem.
    #
    # This was 3000 and is now 8080, to match `scripts/dev-endpoints.ts`, which is
    # where the port is declared. See that file for the demo this prevents: a
    # container publishing the wedge on 3000 while every host-run path served on
    # 8080 is two wedges on two ports, and a person who mixed them was dialling a
    # dead one. The port is written literally here because compose does not read
    # TypeScript, so it is a copy -- and a copy is exactly what the sweep that
    # found this one is for.
    ports:
      - "127.0.0.1:8080:8080"

    # THE CONTAINER'S OWN LIMITS. Not decoration either: a tool that reads a
    # dropped file has no input size the operator chose, so the ceiling belongs
    # to the deployment rather than to whatever the largest CSV happens to be.
    # The 512m is generous for a process that holds one file in memory and will
    # OOM visibly rather than take the host with it.
    #
    # It must also stay comfortably ABOVE --max-old-space-size in the command
    # above. Those are two different ceilings and the kernel's is the one that
    # actually kills the process; a heap cap set at or above it buys nothing.
    mem_limit: 512m
    pids_limit: 128

    # === NO SWAP. THIS IS THE PHASE 8 CONTAINMENT, AND IT IS A CONSTRAINT ===
    #
    # `memswap_limit` EQUAL TO `mem_limit` means the container's total footprint --
    # resident memory PLUS swap -- may not exceed the limit. Memory alone is already
    # allowed to reach it, so the swap allowance is exactly zero, and the kernel
    # cannot page this process's anonymous memory out to disk. That is the exposure
    # ADR-011 section 5(2) named as the largest remaining one, and the one `mlock`
    # would have closed.
    #
    # WHAT THIS IS NOT: it is not mlock. It does not pin pages, it removes the
    # kernel's permission to move them. The difference only shows under pressure,
    # and it is why this is a trade rather than a free win.
    #
    # THE TRADE. Under memory pressure the kernel now has two options and swap is not
    # one of them: reclaim cache, or OOM-KILL this container. For a process holding
    # credentials in an unswappable buffer, a clean kill that loses the plaintext
    # beats a paging decision that copies it to disk. An OOM kill is loud, logged,
    # and `restart: unless-stopped` brings the service back. Swap is quiet and
    # permanent, and it is the failure mode this line exists to prevent.
    #
    # NOT COVERED. The kernel's page cache of the vault FILE is neither swap nor
    # anonymous memory and is not constrained by this. Neither are core dumps.
    # ADR-011 section 5(2) still stands for both, and says so.
    #
    # REQUIRES swap accounting on the host (cgroup v2, or v1 with swapaccount=1).
    # Without it this value is accepted and does nothing -- worth confirming once
    # rather than assuming.
    memswap_limit: 512m

    # Read-only root, with the two paths the process genuinely writes to
    # mounted as writable volumes. A process that does not need to write to its
    # own image should not be able to: this turns "the image was modified at
    # runtime" from an investigation into an error.
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true

    healthcheck:
      # The real route, not a TCP connect. A listener that is up but whose
      # module graph failed to import answers on the socket and 500s on every
      # request, and "up" is not the question being asked.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      # Three failures before the restart, so a slow start is not a crash loop.
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===================== THE LITESTREAM SIDECAR =====================
  #
  # Phase 7 made the ledger replicable. This is the thing that actually does it, in
  # a SEPARATE container sharing the SQLite volume -- a sidecar is the only
  # arrangement where the database's writer and its backup have separate lifetimes.
  # In-process replication would mean a crash takes the backup down with it.
  #
  # THE VOLUME IS MOUNTED READ-ONLY, and that is the point: Litestream only reads
  # the database and its WAL, so the process responsible for restoring this data
  # cannot modify it. That prevents the classic disaster -- a replication agent
  # writing to the thing it is protecting, then failing quietly for a week -- by the
  # mount rather than by a convention somebody has to remember.
  #
  # IT DOES NOT REPLICATE THE LEDGER THAT MATTERS MOST. This backs up the WEDGE's
  # memory record only. The embassy's approval ledger -- who approved which
  # credential read, at what exposure -- is in a different container on a different
  # volume and is NOT covered by this file. See `litestream.sidecar.yml`.
  litestream:
    # Pinned. `:latest` means the agent that restores your database may be a
    # different binary from the one that backed it up, with nothing recording it.
    image: ghcr.io/benbjohnson/litestream:0.3.9
    restart: unless-stopped
    depends_on:
      - wedge

    volumes:
      - wedge-data:/app/workspace:ro
      # THE EMBASSY'S APPROVAL LEDGER. Read-only for the same reason as the volume
      # above: the process that backs this up must not be able to alter it.
      #
      # THIS IS THE CROWN JEWEL. Every row here is a record of which person approved
      # which credential read, at what exposure, and when. It is the document an
      # auditor asks for, and until it was mounted here it existed on exactly one
      # disk -- which is not a backup, it is a hope.
      - embassy-audit:/app/embassy-audit:ro
      - litestream-data:/var/lib/litestream
      # Mounted rather than baked, so changing a replica or retention does not
      # require rebuilding an image.
      - ./litestream.sidecar.yml:/etc/litestream.yml:ro

    command: ["litestream", "replicate", "-config", "/etc/litestream.yml"]

    environment:
      # Passed through from the host environment. NOTHING SECRET IS IN THIS FILE.
      # Compose interpolates these from the operator's shell or a .env the host
      # keeps; an unset variable becomes empty and fails loudly at replication time
      # rather than silently writing to nowhere.
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY}
      REPLICA_URL: ${REPLICA_URL}
      REPLICA_BUCKET: ${REPLICA_BUCKET}
      REPLICA_REGION: ${REPLICA_REGION}

    # Same posture as the wedge: unprivileged, read-only root, capped. The agent is
    # not a trusted process on this host and does not need to be.
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===================== THE EMBASSY =====================
  #
  # === IT WAS A GHOST, AND THAT WAS WORSE THAN NOT HAVING IT ===
  #
  # The approval ledger is the record of which person approved which credential read,
  # at what exposure, and when. Litestream was configured to replicate it and the
  # sidecar mounted the volume -- but NOTHING WROTE TO IT, because the embassy was
  # never a service here. The glob matched no file and the sidecar replicated
  # nothing, SILENTLY, because "no database matched" is a normal state to Litestream.
  #
  # That is the worst shape a backup can have: it appears in the status output, so
  # an operator checking that replication is configured would see it configured. A
  # vault nobody reads and a backup of nothing are the same failure wearing a
  # passing test.
  embassy:
    build:
      context: .
      dockerfile: Dockerfile
    image: neurofebric/embassy:local
    restart: unless-stopped
    depends_on:
      - wedge

    volumes:
      # READ-WRITE. This is the writer for the database the sidecar backs up, and the
      # asymmetry with the sidecar's `:ro` mount is the point: exactly one process may
      # write the ledger, and the process whose job is to restore it may not.
      - embassy-audit:/app/embassy-audit
      # The vault file. The binary credential store this service reads. Named as its
      # own volume rather than shared, so an operator can snapshot the ledger without
      # dragging a file full of credentials into the same backup.
      - embassy-vault:/app/embassy-vault

    # THE PROTOCOL IS STDIO.
    #
    # There is no port and no `ports:` here on purpose. The embassy speaks JSON-RPC
    # over stdin/stdout to whichever agent hosts it; publishing it would put the
    # credential path on a socket. It is also why this service is not the thing a
    # client "connects to" in the usual sense -- something has to spawn it.
    command:
      - node
      - --max-old-space-size=192
      - --experimental-strip-types
      - platform/embassy/bin.mjs

    environment:
      # NONE OF THESE HAVE DEFAULTS, AND THAT IS DELIBERATE.
      #
      # `buildPrecheck` REFUSES to wire the approval path without a ledger it can
      # open -- an approval with no record is not a decision -- and `readConfig`
      # exits 2 when the token or origin is missing. So an operator who sets none of
      # these gets a container that exits immediately with a message naming what is
      # missing, rather than a "degraded" embassy serving the three core tools and
      # quietly recording nothing.
      #
      # The signing key arrives from the host environment and is NEVER written into
      # this file. A credential in a committed compose file is in git history
      # forever.
      NEUROFEBRIC_EMBASSY_TOKEN: ${NEUROFEBRIC_EMBASSY_TOKEN}
      NEUROFEBRIC_CORE_ORIGIN: ${NEUROFEBRIC_CORE_ORIGIN}
      NEUROFEBRIC_AUDIT_DIR: /app/embassy-audit
      NEUROFEBRIC_VAULT_FILE: /app/embassy-vault/vault.bin
      NEUROFEBRIC_VAULT_KEY: ${NEUROFEBRIC_VAULT_KEY}
      NEUROFEBRIC_CAPABILITY: ${NEUROFEBRIC_CAPABILITY}
      # Async HITL, so a restricted call is answered -32001 with a task token rather
      # than holding the caller's request open until a person answers. Off by default
      # because turning it on changes how every restricted call is answered, and that
      # is not something an operator should discover from a log.
      NEUROFEBRIC_ASYNC_HITL: ${NEUROFEBRIC_ASYNC_HITL:-0}

    # Same posture as the wedge: unprivileged, read-only root, capped, no swap. The
    # ledger and the vault are the two most sensitive paths in this system and the
    # container is the only boundary they have.
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128

    # There is no healthcheck. It is a stdio protocol server: there is no socket to
    # connect to and nothing to GET, so the only healthcheck available would be
    # "is the process alive", which the restart policy already covers. Inventing an
    # endpoint to probe would be a healthcheck that tests the healthcheck.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  wedge-data:
    # Named explicitly rather than left to Compose's default, so `docker volume
    # ls` shows where the data is and a `down -v` is a decision rather than an
    # accident. The developer's learned schema memory lives in here, which is the
    # correct place for it: per deployment, and gone when the volume is removed.
    name: neurofebric-wedge-data

  # Scratch space where the replication agent assembles snapshots before upload.
  # A SEPARATE volume from the database on purpose: a replica sharing the volume it
  # backs up can be damaged by the same event it exists to survive.
  litestream-data:
    name: neurofebric-litestream-data

  # THE EMBASSY'S APPROVAL LEDGER.
  #
  # Declared here so the sidecar has something to mount and replicate. NOTE THIS
  # HONESTLY: the embassy is NOT a service in this compose file, so nothing here
  # writes to it yet. Until the embassy is deployed with
  # `NEUROFEBRIC_AUDIT_DIR=/app/embassy-audit` on this volume, the sidecar finds
  # no database at this path and replicates nothing for it -- silently, because
  # Litestream treats "no database matched" as a normal state.
  #
  # A backup that quietly backs up nothing is worse than no backup, because it is
  # counted. So this is stated in three places rather than implied: here, in
  # `litestream.sidecar.yml`, and in ADR-011. Deploying the embassy on this volume
  # is a separate piece of work and is not this commit.
  embassy-audit:
    name: neurofebric-embassy-audit

  # The binary credential vault. Separate from the ledger on purpose: backing up "who
  # approved what" and backing up "the secrets themselves" are different compliance
  # questions with different blast radii, and an operator who wants the first should
  # not have to take the second to get it.
  embassy-vault:
    name: neurofebric-embassy-vault

networks:
  backend-net:
