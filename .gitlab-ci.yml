# GitLab CI gate for the Neurofebric harness.
#
# This file supersedes .github/workflows/ci.yml, which is RETIRED IN PLACE
# and kept for historical reference only (see docs/DECISIONS.md). That
# workflow can no longer execute: the repository has no GitHub remote, and a
# repo-local insteadOf rule rewrites every github.com URL to killswitch.invalid.
# The commands below are the same four that workflow ran.
#
# Dependencies: the harness has ZERO RUNTIME dependencies -- nothing under
# platform/ imports anything outside node's own stdlib -- so the three test
# jobs run on bare node. The root package.json carries exactly one
# devDependency group (typescript, @types/node) used only by the static type
# gate, never imported by platform/ code (docs/DECISIONS.md D-018/D-019).
#
# Node version: nothing in the repo pins a version (no .nvmrc, no engines
# field), so the node:22 image is used. 22 is the floor for
# --experimental-strip-types, which the .ts suites and the proof script need in
# order to import platform .ts modules from node.
#
# All four jobs run in ONE stage and therefore in parallel. They are separate
# jobs rather than sequential steps on purpose: a type error must not be able to
# fail the runtime suite's job, nor a runtime failure to hide a type error.
# Separate contexts also make a red run say which kind of gate is red.
#
# EVERY job runs `npm ci`, including the type gate. `npm run typecheck` shells
# out to `tsc`, which resolves only from node_modules/.bin -- there is no
# global tsc -- so without the install step this job fails with `tsc: not
# found` in a fresh container.
#
# The Windows half of the old matrix (test-windows) is deliberately NOT
# reproduced here. GitLab runners are linux by default; a Windows runner
# requires a project-level runner registration, which is a GitLab project
# settings action reserved for the operator. The ubuntu-only gate is therefore
# a known, documented coverage reduction, not an oversight.
#
# ============================ RUNNER STATUS, 2026-10-05 ======================
# AS OF TODAY THIS FILE HAS NEVER EXECUTED. `glab api projects/.../runners`
# returns 20 visible runners and ZERO of them active and online -- every one is
# paused or disabled. There is no Linux runner and no Windows runner registered
# for this project, so every job below is a promise, not a gate, and the pipeline
# will sit pending until one is provided.
#
# That matters most for the vault permission assertion added to `test-ts` below.
# It closes D-037 caveat two IN CONFIGURATION ONLY. Until a Linux runner runs
# it and the log is READ, "secrets at rest are not world-readable" remains
# unverified, exactly as D-037 said it was. Do not read a green merge as proof
# of that invariant; there has been no green merge, because there has been no
# run. Register a Linux runner and read the `test-ts` log before claiming it.
# ============================================================================
stages:
  - verify

default:
  image: node:22

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

test-mjs:
  stage: verify
  script:
    - npm ci
    - npm run test:mjs

test-ts:
  stage: verify
  script:
    - npm ci
    - npm run test:ts
    # D-037 CAVEAT TWO, CLOSED. `npm run test:ts` above runs
    # platform/core/vault.test.ts on this Linux runner, where the two POSIX
    # permission tests do NOT skip -- so the "secrets at rest are not
    # world-readable" invariant is exercised by the job that was already here.
    #
    # What was missing is PROOF that they ran. A skip is not a failure: widen
    # SKIP_WINDOWS, or refactor the suite so the two tests quietly stop
    # covering anything, and this job stays green while the security claim goes
    # unverified. So this final step asserts the positive -- that both tests
    # appear in the TAP output and neither is skipped. It also fails on a test
    # that stopped existing, because absence produces no skip line either.
    #
    # WHY THIS IS A STEP AND NOT ITS OWN JOB. A dedicated job tagged `linux`
    # would sit PENDING forever against the runner situation documented at the
    # bottom of this file, and a permanently-pending job is a red gate that
    # looks like a broken build. As a step inside an existing blocking job it
    # inherits that job's lifecycle: it runs the moment any Linux runner is
    # registered, with no further edit, and it is enforced from then on.
    - node verification/assert-posix-vault-permissions.mjs

test-proof:
  stage: verify
  # The F-006 live proof is headless and self-contained: it drives the real
  # KernelAdapter and the real recovery decision function with stubbed tool
  # results, uses no model, no gateway and no network, and writes no files.
  script:
    - npm ci
    - npm run test:proof

typecheck:
  stage: verify
  script:
    - npm ci
    - npm run typecheck

# The wrapper table in platform/core/command-position.ts was MEASURED on
# MSYS2/MinGW64, and every job above runs on the node:22 image (Debian), so the
# table has never been re-derived on the platform that actually matters.
#
# `test-ts` above already runs command-position-corpus.test.ts on Linux, and
# that check is necessary but NOT sufficient: the corpus is a STATIC table of
# expectations, so a green run proves the parser still produces the answers it
# produced on Windows. It does not prove the wrapper assumptions still hold.
#
# This job re-derives them. It exits non-zero if a measured claim is refuted on
# the runner, so a divergence between the table and the target fails the build
# rather than being discovered by an agent hitting a false allow.
#
# The probes are benign (printf, env, nice, stdbuf, nohup, exec); none deletes
# anything, and the script needs no credentials or network.
measure-wrappers:
  stage: verify
  script:
    - node verification/measure-command-wrappers.mjs

# WINDOWS. The gap this job exists to close is in handoff.md 10a item 1, and it
# is the oldest open item in the backlog: the wrapper table in
# platform/core/command-position.ts was MEASURED on MSYS2/MinGW64, and every job
# above runs on the node:22 image, which is Debian. So the guard's assumptions
# have never been re-derived on the platform they were measured for. The corpus
# test is necessary but not sufficient: it is a STATIC table of expectations, so
# a green run proves the parser still returns what it returned on Windows, not
# that the wrapper behaviours still hold.
#
# WHY IT IS `windows` AND NOT A TAG YOU CHOOSE. The tag is written down here so
# a future editor does not have to re-derive which jobs must run on it: the
# runtime suites and the type gate. measure-wrappers does NOT, and cannot, run
# here: it shells out to printf, env, nice, stdbuf, nohup and exec, which are
# Unix programs. The Windows equivalent is measure-command-wrappers.mjs running
# under the Git-for-Windows environment the table was measured in -- a
# shell-availability question for the operator, not a pipeline edit.
# WHY THESE ARE MANUAL AND NON-BLOCKING, and this is not a dodge. A runner
# tagged `windows` is NOT registered for this project, and registering one is a
# GitLab project-settings action reserved for the operator. A job with no runner
# sits pending until the pipeline times out and is then reported as FAILED, so
# leaving these blocking would mean a permanent red merge gate that looks like a
# broken build and is really an unconfigured runner.
#
# `allow_failure: true` says the truth: the coverage is missing, we know it is
# missing, and it must not stop anything until a runner exists. `when: manual`
# means the moment one is registered the operator can run all three by hand and
# get a real answer. The day the runner lands, delete both keywords.
#
# The gap is NOT thereby closed. handoff.md 10a item 1 stays open until a green
# Windows run is observed, and this file's comment is the only thing preventing
# that from being quietly forgotten.
test-ts-windows:
  stage: verify
  tags: [windows]
  when: manual
  allow_failure: true
  script:
    - npm ci
    - npm run test:ts

test-mjs-windows:
  stage: verify
  tags: [windows]
  when: manual
  allow_failure: true
  script:
    - npm ci
    - npm run test:mjs

typecheck-windows:
  stage: verify
  tags: [windows]
  when: manual
  allow_failure: true
  script:
    - npm ci
    - npm run typecheck
