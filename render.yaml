services:
  # 1. Backend API & SSE Service
  - type: web
    name: neurofabric-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npx tsx platform/web/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: REDIS_URL
        sync: false

  # 2. Frontend React Dashboard
  - type: web
    name: neurofabric-ui
    runtime: static
    buildCommand: cd platform/ui && npm install && npm run build
    staticPublishPath: platform/ui/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: neurofabric-backend
          property: url