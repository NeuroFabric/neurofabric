services:
  # --- Frontend Console (Static Site on Global CDN) ---
  - type: static
    name: neurofabric-console
    rootDir: platform/ui
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
